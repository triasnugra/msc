name: monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/archive/**'
      - 'data/state/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Uji (gerbang)
        run: npm test

      - name: Build monitor
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run build

      - name: Commit state dan arsip (gagal bila tidak bisa di-push)
        run: |
          set -u
          git config user.name "msc-monitor"
          git config user.email "msc-monitor@users.noreply.github.com"
          git add data/archive data/state
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan state."
            exit 0
          fi
          git commit -m "chore(monitor): update arsip dan state [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push berhasil (percobaan $i)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push gagal (percobaan $i), coba lagi..."
            sleep $((i * 4))
          done
          echo "::error::Commit state/arsip GAGAL setelah 5 percobaan. Run dihentikan agar data basi tidak terbit."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
